<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back office: sign in</title>
<script src="./support.js"></script>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./pos.css">
</helmet>
<div class="pos">
<header class="bar">
<div class="bar-id"><span class="bar-title">Things Remembered</span><span class="bar-sub">Back office</span></div>

</header>
<main class="page col" style="justify-content:center">
<form class="card w-sm wrap" style="padding:32px;gap:22px" onSubmit="{{ submit }}" novalidate>
<div class="wrap" style="gap:6px"><h1 class="page-h">Sign in</h1><p class="lead" style="font-size:16px">Use your own username and password. You will see only the parts of the back office your role allows.</p></div>

<label class="lbl">Username<input class="field big" style="font-size:16px" type="text" autocomplete="username" placeholder="Your username"></label>
<label class="lbl">Password<input class="field big" style="font-size:16px" type="password" autocomplete="current-password" placeholder="Your password"></label>

<button class="btn primary lg block" type="submit">Sign in</button>
<p class="note sep-t">Do not share your password. Forgot it? Ask your supervisor to reset it. At an outlet, sign in on the Cash Point instead.</p>
<a class="btn block" href="SignIn.dc.html">Go to the Cash Point sign in</a>
</form>
</main>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { submit: (e) => { if (e && e.preventDefault) { e.preventDefault(); } window.location.href = 'Production.dc.html'; } };
}
}
</script>
</body>
</html>
